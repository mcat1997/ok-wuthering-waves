steps:
  - action: "编排骨架：建立 profile 名词对象、注册表和 runner，接入一个 stub profile"
    exit_signal: "没有注册 profile 时 runner 明确返回未处理，注册 stub profile 时能返回 handled"
    status: done
  - action: "接入战斗回合：把默认 current.perform() 包成公共回合入口，combat_once() 和 AutoCombatTask.run() 都走它"
    exit_signal: "无 profile 场景下现有回合行为等价，已有切人相关测试不受影响"
    status: done
  - action: "接入队伍匹配：load_chars() 成功后生成签名并匹配 registry"
    exit_signal: "测试能用假角色队伍匹配到 profile，别名 label 不参与匹配"
    status: done
  - action: "安全动作与 fallback：补齐 context 默认动作、指定角色切换、profile fallback、禁用到本次战斗结束"
    exit_signal: "profile 主动 fallback 会调用默认 perform；profile 运行错误会禁用本次战斗 profile 并记录原因"
    status: done
  - action: "爱达千 profile：按视频总轴图映射启动/循环顺序和三名角色的近似动作序列"
    exit_signal: "测试能证明爱达千签名命中内置 profile，起手从千咲开始，并切到达妮娅"
    status: done
  - action: "测试覆盖：覆盖未命中、命中接管、主动 fallback、异常禁用、重新 load 后恢复匹配"
    exit_signal: "新增测试和现有自动战斗 / 换人测试都通过"
    status: done

